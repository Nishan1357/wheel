<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin & Win</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #7f7fd5, #86a8e7, #91eae4);
  font-family: Poppins, Arial, sans-serif;
}

.card {
  width: 380px;
  padding: 28px;
  text-align: center;
  border-radius: 18px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  color: #fff;
}

h1 {
  font-size: 22px;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 15px;
}

.wheel-wrapper {
  position: relative;
  width: 340px;
  height: 340px;
  margin: 0 auto 20px;
}

canvas {
  border-radius: 50%;
  background: #fff;
  border: 8px solid rgba(255,255,255,0.7);
}

.pointer {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 26px solid #ff5722;
  z-index: 5;
}

/* .center-dot {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ff5722;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
} */

button {
  background: #ff5722;
  border: none;
  padding: 14px 28px;
  font-size: 15px;
  border-radius: 30px;
  color: #fff;
  cursor: pointer;
}
button:disabled {
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="card">
  <h1>FinTreasure</h1>
  <div class="subtitle">Pointer always lands on the task</div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheel" width="340" height="340"></canvas>
    <!-- <div class="center-dot"></div> -->
  </div>

  <button id="spinBtn">SPIN NOW</button>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spinBtn");

/* ACTIVITIES */
const offers = [
  "TASK 1","TASK 2","TASK 3","TASK 4","TASK 5",
  "TASK 6","TASK 7","TASK 8","TASK 9","TASK 10"
];

/* COLORS */
const colors = [
  "#ffcc80","#80deea","#c5e1a5","#f8bbd0","#d1c4e9",
  "#ffe082","#b2dfdb","#ffab91","#ce93d8","#a5d6a7"
];

/* TASK DETAILS */
const tasks = [
`<b>The Scenario:</b><br>You are a team that has just reached a checkpoint.<br><br>
<b>The Task:</b><br>Form a perfect straight line in ascending order of height.<br><br>
<b>The Action:</b><br>• No talking allowed<br>• Hold position for 5 seconds<br><br>
📸 <b>Proof:</b> Photo of the line.`,

`<b>The Scenario:</b><br>You have 60 seconds to prove your coordination.<br><br>
<b>The Task:</b><br>Form a circle and sit down together at the same time.<br><br>
<b>The Action:</b><br>• One attempt only<br>• Everyone must sit simultaneously<br><br>
📸 <b>Proof:</b> Short video.`,

`<b>The Scenario:</b><br>Show teamwork without using words.<br><br>
<b>The Task:</b><br>Spell a 4-letter word using hand signs.<br><br>
<b>The Action:</b><br>• No talking<br>• All letters visible at once<br><br>
📸 <b>Proof:</b> Photo.`,

`<b>The Scenario:</b><br>Speed matters.<br><br>
<b>The Task:</b><br>Line → Circle → Triangle<br><br>
<b>The Action:</b><br>• Continuous movement<br>• No verbal instructions<br><br>
📸 <b>Proof:</b> Video under 1 minute.`,

`<b>The Scenario:</b><br>Act without speaking.<br><br>
<b>The Task:</b><br>One member acts an emotion, others guess.<br><br>
<b>The Action:</b><br>• No words<br>• Max 30 seconds<br><br>
📸 <b>Proof:</b> Short video.`,

`<b>The Scenario:</b><br>Physical coordination challenge.<br><br>
<b>The Task:</b><br>Pass a small object without hands.<br><br>
<b>The Action:</b><br>• First to last member<br>• Restart if dropped<br><br>
📸 <b>Proof:</b> Video.`,

`<b>The Scenario:</b><br>Creative checkpoint.<br><br>
<b>The Task:</b><br>Freeze into a statue showing “College Life”.<br><br>
<b>The Action:</b><br>• Freeze 5 seconds<br>• One pose only<br><br>
📸 <b>Proof:</b> Photo.`,

`<b>The Scenario:</b><br>Quick thinking required.<br><br>
<b>The Task:</b><br>Arrange by shoe size or birth month.<br><br>
<b>The Action:</b><br>• No phones<br>• No talking<br><br>
📸 <b>Proof:</b> Photo.`,

`<b>The Scenario:</b><br>Show unity.<br><br>
<b>The Task:</b><br>All members jump together.<br><br>
<b>The Action:</b><br>• One attempt<br>• Everyone in air<br><br>
📸 <b>Proof:</b> Photo or video.`,

`<b>The Scenario:</b><br>Final coordination check.<br><br>
<b>The Task:</b><br>Create any recognizable shape.<br><br>
<b>The Action:</b><br>• Hold 5 seconds<br><br>
📸 <b>Proof:</b> Photo.`
];

const radius = canvas.width / 2;
const arc = (2 * Math.PI) / offers.length;

let angle = 0;
let spinning = false;

/* DRAW WHEEL */
function drawWheel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let start = angle;

  offers.forEach((text, i) => {
    const end = start + arc;
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + arc / 2);
    ctx.fillStyle = "#333";
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, radius * 0.7, 8);
    ctx.restore();

    start = end;
  });
}

/* SPIN */
spinBtn.onclick = () => {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;

  let speed = Math.random() * 25 + 30;
  const friction = 0.985;

  const spin = setInterval(() => {
    angle += speed * Math.PI / 180;
    speed *= friction;

    if (speed < 0.3) {
      clearInterval(spin);
      spinning = false;
      spinBtn.disabled = false;
      showResult();
    }
    drawWheel();
  }, 16);
};

/* RESULT */
function showResult() {
  const normalized =
    (2 * Math.PI - (angle % (2 * Math.PI)) - Math.PI / 2 + 2 * Math.PI)
    % (2 * Math.PI);

  const index = Math.floor(normalized / arc);

  Swal.fire({
    title: offers[index],
    html: tasks[index],
    icon: "info",
    confirmButtonText: "Got it!"
  });
}

drawWheel();
</script>

</body>
</html>
